<main class="agenda" [class.drawing-mode]="dibujando" [class.hand-mode]="herramienta === 'mano'">
  <div class="book-shell">
    <div #libro class="book">
      @for (fecha of paginas; track claveFecha(fecha)) {
        <section class="page" [attr.data-date]="claveFecha(fecha)">
          <div class="page-content">
            <header class="page-header">
              <span>{{ formato(fecha) }}</span>
              <span class="page-number">{{ fecha.getDate() }}</span>
            </header>
            <div class="writing-area">
              <textarea
                [ngModel]="notas[claveFecha(fecha)] || ''"
                (ngModelChange)="guardarNota(claveFecha(fecha), $event)"
                [attr.aria-label]="'Notas del ' + formato(fecha)"
                spellcheck="false"
              ></textarea>
              <canvas
                [attr.data-canvas-date]="claveFecha(fecha)"
                width="1200"
                height="1400"
                (pointerdown)="iniciarDibujo($event, $any($event.target))"
                (pointermove)="moverDibujo($event, $any($event.target))"
                (pointerup)="terminarDibujo($any($event.target))"
                (pointercancel)="terminarDibujo($any($event.target))"
              ></canvas>
            </div>
          </div>
        </section>
      }
    </div>
  </div>

  <button
    class="page-arrow previous-arrow"
    (click)="pasarPagina(-1)"
    aria-label="Días anteriores"
    title="Días anteriores"
  >
    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
  </button>
  <button
    class="page-arrow next-arrow"
    (click)="pasarPagina(1)"
    aria-label="Días siguientes"
    title="Días siguientes"
  >
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
  </button>

  <div class="floating-tools">
    <button
      class="tool-button"
      [class.active]="herramienta === 'mano'"
      (click)="seleccionarHerramienta('mano')"
      title="Pasar páginas"
      aria-label="Mano"
    >
      <svg viewBox="0 0 24 24">
        <path
          d="M8 12V5a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v7-3a1.5 1.5 0 0 1 3 0v7c0 4-2.5 6-6 6h-2c-2 0-3-1-4-2l-4-5a1.8 1.8 0 0 1 2.8-2.2L8 15"
        />
      </svg>
    </button>
    <button
      class="tool-button"
      [class.active]="herramienta === 'lapiz'"
      (click)="seleccionarHerramienta('lapiz')"
      title="Lápiz"
      aria-label="Lápiz"
    >
      <svg viewBox="0 0 24 24">
        <path d="m14 5 5 5M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z" />
      </svg>
    </button>
    <button
      class="tool-button"
      [class.active]="herramienta === 'goma'"
      (click)="seleccionarHerramienta('goma')"
      title="Goma"
      aria-label="Goma"
    >
      <svg viewBox="0 0 24 24">
        <path d="m7 16 9-9a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3l-7 7H9l-2-2a2 2 0 0 1 0-3Z" />
        <path d="m11 8 7 7M13 18h8" />
      </svg>
    </button>
    <div class="calendar-trigger" [class.expanded]="selectorAbierto">
      <button
        class="tool-button calendar-button"
        (click)="alternarSelector()"
        aria-label="Abrir calendario"
        title="Ir a una fecha"
      >
        <span class="calendar-dot"></span>
      </button>
      @if (selectorAbierto) {
        <div class="calendar-content" (click)="$event.stopPropagation()">
          <input
            type="date"
            [value]="fechaSeleccionada"
            (change)="seleccionarFecha($any($event.target).value)"
            aria-label="Seleccionar fecha"
          />
          <button class="today-button" (click)="irAHoy()">Hoy</button>
        </div>
      }
    </div>
  </div>
</main>
